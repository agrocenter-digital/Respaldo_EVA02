# Puerto y nombre del microservicio
server.port=${SERVER_PORT:8081}
spring.application.name=ms-inventario

# PostgreSQL. Se mantienen las variables originales DB_HOST/DB_PORT/DB_NAME/DB_USER
# y se agregan DB_URL/DB_USERNAME para facilitar el despliegue en RDS.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_inventario}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate. El perfil prod cambia ddl-auto a validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# AWS Cognito / OAuth2 Resource Server.
# Configurar siempre estos valores reales fuera de pruebas y desarrollo local.
agrocenter.security.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
agrocenter.security.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}
agrocenter.security.jwt.audience=${COGNITO_AUDIENCE:agrocenter-api}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}

# Kafka / consumidor de ordenes-compras y productor de alertas inventario-critico
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-inventario}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agrocenter.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.agrocenter.ms_inventario.messaging.event.OrdenCompraEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000

# Actuator: solo se publica health y sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI se mantiene disponible para desarrollo y se desactiva en produccion.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# No exponer trazas ni detalles internos en respuestas automaticas.
server.error.include-stacktrace=never
server.error.include-message=never

# Lista comercial explícita de SKU cotizables; vacío conserva venta minorista existente.
agrocenter.catalogo.skus-solo-cotizacion=${CATALOG_QUOTE_ONLY_SKUS:}

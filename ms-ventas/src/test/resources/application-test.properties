spring.datasource.url=jdbc:h2:mem:ventas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.agrocenter.local/cognito
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test.agrocenter.local/cognito/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=agrocenter-api
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
agrocenter.inventory.base-url=http://localhost:65534
agrocenter.inventory.connect-timeout=100ms
agrocenter.inventory.read-timeout=100ms
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.admin.fail-fast=false

name: Build and Push bff-web to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build Docker Image and Push & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrocenter-bff:latest

      # PASO NUEVO: Conectarse a la EC2 por SSH y actualizar los contenedores
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/agrocenter-deploy
            docker compose pull bff-web
            docker compose up -d bff-web
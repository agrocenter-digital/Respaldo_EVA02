server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: bff-web
  jackson:
    time-zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_bff}}
    username: ${DB_USERNAME:${DB_USER:postgres}}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    admin:
      fail-fast: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}

agrocenter:
  security:
    jwt:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
      jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}
      audience: ${COGNITO_AUDIENCE:agrocenter-api}
    dev:
      jwt-secret: ${DEV_JWT_SECRET:}
      issuer: ${DEV_JWT_ISSUER:http://localhost:8081/dev-issuer}
      audience: ${COGNITO_AUDIENCE:agrocenter-api}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://front-web-seven.vercel.app,http://localhost:3000,http://localhost:5173}
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}
  mensajeria:
    topicos: ${KAFKA_TOPICS:ordenes-compras,inventario-critico}

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:${MS_INVENTARIO_URL:http://localhost:8081}}
    connect-timeout: ${MS_INVENTARIO_CONNECT_TIMEOUT:5s}
    response-timeout: ${MS_INVENTARIO_RESPONSE_TIMEOUT:10s}
  sales:
    base-url: ${SALES_SERVICE_URL:${MS_VENTAS_URL:http://localhost:8082}}
    connect-timeout: ${MS_VENTAS_CONNECT_TIMEOUT:5s}
    response-timeout: ${MS_VENTAS_RESPONSE_TIMEOUT:20s}
  purchases:
    base-url: ${PURCHASES_SERVICE_URL:${MS_COMPRAS_URL:http://localhost:8083}}
    connect-timeout: ${MS_COMPRAS_CONNECT_TIMEOUT:5s}
    response-timeout: ${MS_COMPRAS_RESPONSE_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

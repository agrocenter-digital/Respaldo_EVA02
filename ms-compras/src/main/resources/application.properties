server.port=${SERVER_PORT:8083}
spring.application.name=ms-compras

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_compras}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agrocenter.security.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
agrocenter.security.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}
agrocenter.security.jwt.audience=${COGNITO_AUDIENCE:agrocenter-api}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DBCBjL67J/.well-known/jwks.json}

agrocenter.inventory.base-url=${INVENTORY_SERVICE_URL:${MS_INVENTARIO_URL:http://localhost:8081}}
agrocenter.inventory.connect-timeout=${INVENTORY_CONNECT_TIMEOUT:5s}
agrocenter.inventory.read-timeout=${INVENTORY_READ_TIMEOUT:10s}
agrocenter.inventory.service-token=${INVENTORY_SERVICE_TOKEN:}

# Kafka / consumidor de alertas de inventario critico para reabastecimiento automatico
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-compras}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.agrocenter.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.agrocenter.compras.messaging.event.InventarioCriticoEvent

# Proveedor por defecto para las ordenes de reabastecimiento automatico generadas por eventos
agrocenter.compras.reabastecimiento.proveedor-id=${COMPRAS_AUTO_PROVEEDOR_ID:1}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-stacktrace=never
server.error.include-message=never
spring.jackson.time-zone=UTC
